name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisory drift and action rot happen without pushes too.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check --manifest-path daemon/Cargo.toml
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
      - run: shellcheck scripts/*.sh install.sh uninstall.sh install-macos.sh uninstall-macos.sh
      - run: ./scripts/check-version.sh
      # The mime tables and the protocol constants exist in three languages;
      # nothing but this stops them drifting apart.
      - run: ./scripts/check-consistency.sh

  daemon:
    name: Daemon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-26-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      # The macOS and Windows capture backends cannot be cross-checked from a
      # Linux workstation: the bundled SQLite needs a C toolchain for the
      # target. These three jobs are what actually proves they compile.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo build --release --locked --all-features
      # Without the feature the daemon decodes nothing at all, and the code
      # that is left has to stand on its own — including having no constants
      # that only the removed half referred to.
      - name: Check without thumbnails
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo build --release --locked --no-default-features

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.95 --profile minimal
      - run: cargo +1.95 check --locked --manifest-path daemon/Cargo.toml

  extension:
    name: GNOME extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-bin gjs
      - run: ./scripts/check-extension.sh
      - name: Check the extension's own logic
        run: |
          gjs -m extension/tests/smoke.js
          test_root="$(mktemp -d)"
          XDG_RUNTIME_DIR="${test_root}" gjs -m extension/tests/framing.js
          rmdir "${test_root}"

  e2e:
    name: End to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows included: it is the only run that exercises uds_windows.
        os: [ubuntu-latest, macos-latest, macos-26-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: cargo build --release --locked --manifest-path daemon/Cargo.toml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.17'
      - name: Record and read the isolated archive (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          RLDYOUR_CLIPBOARD_HOME="$(mktemp -d /tmp/cb.XXXX)"
          export RLDYOUR_CLIPBOARD_HOME
          export RLDYOUR_CLIPBOARD_CAPTURE=0
          ./daemon/target/release/rldyour-clipboardd &
          daemon=$!
          trap 'kill "${daemon}" 2>/dev/null || true' EXIT
          sleep 1
          PYTHONPATH=python/src uv run --no-project python scripts/e2e-sample.py
          if [[ "${RUNNER_OS}" == 'Linux' ]]; then
            sudo apt-get update && sudo apt-get install --no-install-recommends -y gjs
            gjs -m extension/tests/client.js
          else
            PYTHONPATH=python/src uv run --no-project python -c 'from rldyour_clipboard import Client; c=Client(role="both", watch=False); c.record([("text/plain", b"native socket synthetic")]); c.record([("text/plain", b"native socket synthetic large:" + b"x" * (3 * 1024 * 1024))]); c.close()'
            swiftc -swift-version 6 -parse-as-library -warnings-as-errors macos/Models.swift macos/SocketClient.swift macos/tests/SocketTests.swift -o /tmp/clipboard-socket-test
            /tmp/clipboard-socket-test "${RLDYOUR_CLIPBOARD_HOME}/rldyour-clipboard.sock"
          fi
      - name: Verify retention and restart (Unix)
        if: runner.os != 'Windows'
        run: PYTHONPATH=python/src uv run --no-project python scripts/retention-e2e.py
      - name: Record and read the isolated archive (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:RLDYOUR_CLIPBOARD_HOME = Join-Path ([IO.Path]::GetTempPath()) ([Guid]::NewGuid().ToString())
          New-Item -ItemType Directory $env:RLDYOUR_CLIPBOARD_HOME | Out-Null
          $env:RLDYOUR_CLIPBOARD_CAPTURE = '0'
          $daemon = Start-Process -PassThru -WindowStyle Hidden daemon/target/release/rldyour-clipboardd.exe
          try { Start-Sleep -Seconds 1; ./scripts/e2e-sample.ps1 }
          finally { Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue }

  python-client:
    name: Python client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.17'
      - name: Run the test suite
        shell: bash
        run: PYTHONPATH=python/src uv run --no-project --with pytest==9.1.1 pytest python/tests
      - if: runner.os == 'Linux'
        run: uv build python

  macos-client:
    name: Native macOS client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          swiftc -target "$(uname -m)-apple-macosx12.0" -swift-version 6 -parse-as-library -warnings-as-errors -O -framework AppKit macos/*.swift -o /tmp/clipboard-app
          swiftc -swift-version 6 -parse-as-library -warnings-as-errors macos/Models.swift macos/tests/ModelsTests.swift -o /tmp/clipboard-model-tests
          /tmp/clipboard-model-tests
          plutil -lint macos/*.plist daemon/launchd/*.plist

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install cargo-audit --version 0.22.1 --locked
      - run: cargo audit
        working-directory: daemon

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gate everything on the tag matching every published version string,
      # before any runner spends a minute building.
      - run: ./scripts/check-version.sh "${GITHUB_REF_NAME}"

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-bin
      - run: ./scripts/check-extension.sh
      - run: cargo test --all-features --locked --manifest-path daemon/Cargo.toml
      - run: cargo build --release --all-features --locked --manifest-path daemon/Cargo.toml
      - name: Package Linux
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stage/daemon/systemd dist/stage/prebuilt
          install -m755 daemon/target/release/rldyour-clipboardd dist/stage/prebuilt/rldyour-clipboardd
          install -m644 daemon/systemd/* dist/stage/daemon/systemd/
          install -m644 LICENSE CHANGELOG.md dist/stage/
          install -m755 install.sh uninstall.sh dist/stage/
          cp -r extension dist/stage/extension
          rm -r dist/stage/extension/tests
          glib-compile-schemas dist/stage/extension/schemas
          tar -czf "dist/rldyour-clipboard-${version}-x86_64-linux.tar.gz" -C dist/stage .
          cp -r extension dist/extension
          rm -r dist/extension/tests
          glib-compile-schemas dist/extension/schemas
          (cd dist/extension && zip -qr "../rldyour-clipboard-gnome-${version}.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/rldyour-clipboard-*

  macos:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked --all-features --manifest-path daemon/Cargo.toml
      - run: cargo build --release --locked --all-features --manifest-path daemon/Cargo.toml
      - name: Package macOS
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          arch="$(uname -m)"
          app="dist/stage/prebuilt/rldyour-clipboard.app"
          mkdir -p "${app}/Contents/MacOS" dist/stage/prebuilt dist/stage/macos dist/stage/daemon/launchd
          swiftc -target "${arch}-apple-macosx12.0" -swift-version 6 -parse-as-library -warnings-as-errors -O -framework AppKit macos/*.swift -o "${app}/Contents/MacOS/rldyour-clipboard"
          plutil -create xml1 "${app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string rldyour-clipboard' "${app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string io.nddev.rldyour-clipboard' "${app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string rldyour-clipboard' "${app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :LSUIElement bool true' "${app}/Contents/Info.plist"
          codesign --force --sign - "${app}"
          install -m755 daemon/target/release/rldyour-clipboardd dist/stage/prebuilt/
          install -m644 macos/*.plist dist/stage/macos/
          install -m644 daemon/launchd/*.plist dist/stage/daemon/launchd/
          install -m755 install-macos.sh uninstall-macos.sh dist/stage/
          install -m644 LICENSE CHANGELOG.md dist/stage/
          printf '%s\n' "${version}" > dist/stage/VERSION
          (cd dist/stage && zip -qry "../rldyour-clipboard-${version}-${arch}-macos.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.os }}
          path: dist/rldyour-clipboard-*.zip

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked --all-features --manifest-path daemon/Cargo.toml
      - run: cargo build --release --locked --all-features --manifest-path daemon/Cargo.toml
      - name: Package Windows
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item daemon/target/release/rldyour-clipboardd.exe, LICENSE, CHANGELOG.md dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/rldyour-clipboard-$version-x86_64-windows.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/rldyour-clipboard-*.zip

  python:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.17'
      - run: uv build python
      - run: uv run --no-project --with twine==7.0.0 twine check python/dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python
          path: python/dist/*

  publish:
    needs: [linux, macos, windows, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/checksums.py dist
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes -- dist/*
